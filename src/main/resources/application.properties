spring.application.name=labguard-ai
server.port=${PORT:${SERVER_PORT:8080}}

# ---------- 数据源：默认 SQLite 文件库（分工计划冻结技术栈），可用 .env/环境变量覆盖 ----------
spring.datasource.url=${DB_URL:jdbc:sqlite:./data/labguard.db}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
# 启动时自动执行 src/main/resources/schema.sql（全部 IF NOT EXISTS，可重复启动）
spring.sql.init.mode=${SQL_INIT_MODE:always}

# ---------- 文件上传：仅 JPG/JPEG/PNG，单张不超过 10MB（与 ImageInput 校验一致） ----------
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=10MB
labguard.storage.root=${UPLOAD_DIR:uploads}

# ---------- Thymeleaf / 日志 ----------
spring.thymeleaf.cache=false
logging.level.com.labguard=info

# ---------- 视觉 AI 配置（成员 A）：demo 模式不调用真实 API；real 模式配置不完整时直接报错，不会伪造结果 ----------
labguard.ai.mode=${VISION_MODE:demo}
labguard.ai.base-url=${VISION_API_BASE_URL:}
labguard.ai.api-key=${VISION_API_KEY:}
labguard.ai.model=${VISION_MODEL:}
labguard.ai.connect-timeout=${VISION_CONNECT_TIMEOUT:5s}
labguard.ai.read-timeout=${VISION_READ_TIMEOUT:30s}
# 人工核验规则：置信度低于阈值（0~1）时强制 needsHumanReview=true。
labguard.ai.min-confidence=${VISION_MIN_CONFIDENCE:0.6}
# 风险类别白名单（逗号分隔，大写比较）；留空表示不限制，未知类别不会被静默映射为已知类别。
labguard.ai.category-whitelist=${VISION_CATEGORY_WHITELIST:}
