spring.application.name=labguard-ai
server.port=${PORT:8080}
spring.datasource.url=jdbc:sqlite:./data/labguard.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 视觉 AI 配置（成员 A）：demo 模式不调用真实 API；real 模式配置不完整时直接报错，不会伪造结果。
labguard.ai.mode=${VISION_MODE:demo}
labguard.ai.base-url=${VISION_API_BASE_URL:}
labguard.ai.api-key=${VISION_API_KEY:}
labguard.ai.model=${VISION_MODEL:}
labguard.ai.connect-timeout=${VISION_CONNECT_TIMEOUT:5s}
labguard.ai.read-timeout=${VISION_READ_TIMEOUT:30s}
