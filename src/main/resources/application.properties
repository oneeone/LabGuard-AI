spring.application.name=labguard
server.port=${SERVER_PORT:8080}

# ---------- 数据源（默认 H2 文件模式，可用 .env 中的 DB_URL 等覆盖，切换 MySQL 见 README） ----------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/labguard}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# 启动时自动执行 src/main/resources/schema.sql（成员B维护）
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ---------- 文件上传 ----------
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}
labguard.storage.upload-dir=${UPLOAD_DIR:uploads}
labguard.storage.max-file-size=${MAX_FILE_SIZE_BYTES:5242880}
labguard.storage.allowed-extensions=jpg,jpeg,png,gif,webp

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- 日志 ----------
logging.level.com.labguard=info
