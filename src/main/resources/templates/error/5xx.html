<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>服务暂时不可用 · LabGuard AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <nav class="topnav">
        <a th:href="@{/inspections/new}">新建巡检</a>
        <a th:href="@{/workorders}">整改工单</a>
    </nav>

    <header class="page-header">
        <h1>服务暂时不可用</h1>
        <p>本次操作没有完成，请稍后重试。若反复出现，请联系系统管理员查看服务日志。</p>
    </header>

    <section class="card error-card">
        <p class="error-code" th:text="${status} ?: 500">500</p>
        <p class="hint" th:if="${path != null}" th:text="|请求路径：${path}|">请求路径：/unknown</p>
        <p>图片与工单数据不会因本次错误被自动修改；请确认上一步操作的实际结果后再重试。</p>
        <div class="form-actions">
            <a class="btn btn-secondary" th:href="@{/workorders}">查看工单列表</a>
            <a class="btn btn-primary" th:href="@{/inspections/new}">返回新建巡检</a>
        </div>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
