<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>页面不存在 · LabGuard AI</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo-mark.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <nav class="topnav" aria-label="主导航">
        <a class="brand" th:href="@{/}" aria-label="LabGuard AI 首页">
            <img class="brand-logo" th:src="@{/images/logo.svg}" alt="LabGuard AI">
        </a>
        <div class="nav-actions">
            <a class="btn btn-primary nav-action" th:href="@{/inspections/new}">新建巡检</a>
            <a class="btn btn-secondary nav-action" th:href="@{/workorders}">整改工单</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>找不到请求的页面</h1>
        <p>巡检记录或整改工单可能已被删除，也可能是链接地址有误。</p>
    </header>

    <section class="card error-card">
        <p class="error-code" th:text="${status} ?: 404">404</p>
        <p class="hint" th:if="${path != null}" th:text="|请求路径：${path}|">请求路径：/unknown</p>
        <p>请从下面的入口重新开始，已提交的数据不会因本次错误丢失。</p>
        <div class="form-actions">
            <a class="btn btn-secondary" th:href="@{/workorders}">查看工单列表</a>
            <a class="btn btn-primary" th:href="@{/inspections/new}">新建巡检</a>
        </div>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
